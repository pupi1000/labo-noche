[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsi-agent-lab"
version = "1.0.0"
description = "Laboratorio didactico de agentes para Taller de Sistemas Inteligentes"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.42",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langchain-ollama>=0.3",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "openai>=1.68",
  "azure-identity>=1.19",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
